name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-14-xlarge]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run script self-tests
        run: |
          for s in test-event-parser test-provenance-contract test-release-discovery test-coverage test-release-app test-test-quality; do
            echo "=== self-test: $s ==="
            if zsh "scripts/tests/$s.sh" > "/tmp/$s.out" 2>&1; then
              tail -3 "/tmp/$s.out"
            else
              echo "::error::self-test $s failed: $(tail -c 500 "/tmp/$s.out" | tr '\n' ' ')"
              cat "/tmp/$s.out"
              echo "--- toolchain ---"
              swift --version
              exit 1
            fi
          done

      - name: Static test quality scan
        run: ./scripts/check-test-quality.sh

      - name: Full test suite
        run: swift test --disable-sandbox --no-parallel -Xswiftc -warnings-as-errors

      - name: Strict debug build
        run: swift build --product LaunchPadApp -Xswiftc -warnings-as-errors

      - name: Strict release build
        run: swift build -c release --product LaunchPadApp -Xswiftc -warnings-as-errors
