name: performance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  performance:
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@v5

      - name: Run performance benchmarks
        run: |
          mkdir -p perf-logs
          swift test --filter PerformanceTests --no-parallel --disable-sandbox \
            > "perf-logs/perf-$(date +%Y%m%d-%H%M%S).log" 2>&1

      - name: Upload performance log for trend retention
        uses: actions/upload-artifact@v4
        with:
          name: performance-log
          path: perf-logs/
          retention-days: 30
